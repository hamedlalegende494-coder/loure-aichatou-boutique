<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration du catalogue en ligne</title>
<style>
  body{
    font-family: -apple-system, sans-serif;
    background:#efece5;
    color:#1c2321;
    padding:24px;
    max-width:480px;
    margin:0 auto;
  }
  h1{ font-size:20px; }
  button{
    width:100%;
    padding:16px;
    font-size:15px;
    background:#1c2321;
    color:white;
    border:none;
    border-radius:6px;
    margin-top:16px;
  }
  #result{
    margin-top:20px;
    padding:16px;
    background:white;
    border-radius:6px;
    word-break:break-all;
    font-family:monospace;
    font-size:14px;
    display:none;
  }
  #result.show{ display:block; }
  .id{
    font-size:20px;
    font-weight:bold;
    color:#a9884f;
    user-select:all;
  }
  .error{ color:#9c3f3a; }
</style>
</head>
<body>
  <h1>Configuration du catalogue partagé</h1>
  <p>Cliquez une seule fois sur le bouton ci-dessous. Il va créer votre base de données en ligne, où seront stockés vos produits et vos commandes.</p>
  <button id="go">Créer mon catalogue en ligne</button>
  <div id="result"></div>

<script>
document.getElementById('go').onclick = async function(){
  const btn = document.getElementById('go');
  const resultEl = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = 'Création en cours...';

  try{
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': '$2a$10$RDutW.tbUBH/mrgn1P.1V.iqldPVLTkrqcGFa4VoF.7qrCAbBHd62',
        'X-Bin-Name': 'loure-aichatou-catalogue'
      },
      body: JSON.stringify({ products: [], orders: [] })
    });

    if(!res.ok){
      throw new Error('Erreur HTTP ' + res.status);
    }

    const data = await res.json();
    const binId = data.metadata.id;

    resultEl.classList.add('show');
    resultEl.innerHTML = `
      <p>✅ Catalogue créé avec succès !</p>
      <p>Voici votre identifiant (Bin ID) :</p>
      <div class="id">${binId}</div>
      <p style="margin-top:12px;">Copiez cet identifiant et envoyez-le dans la conversation avec Claude pour terminer la configuration.</p>
    `;
    btn.style.display = 'none';
  }catch(err){
    resultEl.classList.add('show');
    resultEl.innerHTML = `<p class="error">❌ Une erreur est survenue : ${err.message}</p><p>Vérifiez votre connexion internet et réessayez.</p>`;
    btn.disabled = false;
    btn.textContent = 'Réessayer';
  }
};
</script>
</body>
</html>
